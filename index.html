<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Public Person Search</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="terminal">

  <header>
    <div class="lights">
      <span class="red"></span>
      <span class="yellow"></span>
      <span class="green"></span>
    </div>

    <div class="title">
      PUBLIC PERSON SEARCH
    </div>
  </header>

  <div class="warning">
    ⚠ PUBLIC INFORMATION SEARCH
  </div>

  <main>

    <div class="label">
      ENTER PERSON
    </div>

    <input
      id="firstName"
      type="text"
      placeholder="FIRST NAME"
    >

    <input
      id="lastName"
      type="text"
      placeholder="LAST NAME"
    >

    <input
      id="location"
      type="text"
      placeholder="CITY OR STATE (OPTIONAL)"
    >

    <button onclick="searchPerson()">
      [ SEARCH ]
    </button>

    <div id="status"></div>

    <div id="results"></div>

  </main>

</div>

<script src="app.js"></script>

</body>
</html>
